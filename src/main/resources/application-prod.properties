# Production Routing Mapping Render Environment Inputs
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect - spatial (PostGIS) support is built-in since Hibernate 6+
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway safety configurations for persistent storage
spring.flyway.clean-on-validation-error=false

# JWT Configuration (must be set via environment variables)
jwt.secret=${JWT_SECRET}

# Razorpay Configuration (must be set via environment variables)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS Configuration
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}