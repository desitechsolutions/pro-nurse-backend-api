# Production Routing Mapping Render Environment Inputs
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Spatial engine optimizing targets
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway safety configurations for persistent storage
spring.flyway.clean-on-validation-error=false

# JWT Configuration (must be set via environment variables)
jwt.secret=${JWT_SECRET}

# Razorpay Configuration (must be set via environment variables)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# CORS Configuration
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}