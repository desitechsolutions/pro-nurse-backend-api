# H2 Core URL Linkage using PostgreSQL Emulation Mode
spring.datasource.url=jdbc:h2:mem:pronurse_mock_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Management Panel Console URL Target
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Spatial dialect fallback for local H2 mock matching
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Let Flyway run migrations before Hibernate checks schema states
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=true

