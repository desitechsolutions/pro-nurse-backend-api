jwt.secret=+O+lT01PYSxnXOMeI0qfYNyOR/eS4VWSlTNTLADH6DIWxBR5QCuuw0aMaNAMfaw8/Q7k5bBFjR9IFAca4Bth4Q==

# Razorpay Test Configuration (use test keys for local development)
razorpay.key.id=rzp_test_dummy_key_id
