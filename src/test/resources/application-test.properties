# Test Profile Configuration
spring.application.name=pro-nurse-backend-api-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false

# Flyway Configuration for Tests - DISABLED (using schema.sql instead)
spring.flyway.enabled=false

# SQL Initialization - Spring Boot will automatically load schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Configuration for Tests (Base64-encoded 512-bit key for HS512)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1pbi10ZXN0LWVudmlyb25tZW50LW9ubHktdGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LXRvLW1lZXQtdGhlLTUxMi1iaXQtcmVxdWlyZW1lbnQ=
jwt.expiration=3600000
jwt.refreshExpiration=604800000

# Disable unnecessary features in tests
spring.jmx.enabled=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.pronurse=INFO
logging.level.org.flywaydb=DEBUG

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# SMS Configuration for Tests (Use Mock Implementation)
sms.provider=mock
sms.enabled=false

# Razorpay Configuration for Tests (Mock values)
razorpay.key.id=test_razorpay_key_id
razorpay.key.secret=test_razorpay_key_secret

# Firebase FCM Configuration for Tests (Mock values)
fcm.service.account.path=test-firebase-service-account.json
